plugins { id 'com.android.application' }

def keyFile = rootProject.file('.signing/keystore.properties')
def keys = new Properties()
if (keyFile.exists()) keyFile.withInputStream { keys.load(it) }
if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') } && !keyFile.exists()) {
    throw new GradleException('Release key missing. Restore .signing/keystore.properties and its keystore; do not generate a replacement for a published app.')
}

android {
    namespace 'ru.serg.slogi'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'ru.slavikus.slovoboy'
        minSdk 23
        targetSdk 35
        versionCode 107
        versionName '1.1.0-levels-rc1'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (keyFile.exists()) {
                storeFile new File(keyFile.parentFile, keys.getProperty('storeFile'))
                storePassword keys.getProperty('storePassword')
                keyAlias keys.getProperty('keyAlias')
                keyPassword keys.getProperty('keyPassword')
                enableV1Signing true
                enableV2Signing true
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true; checkReleaseBuilds true }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
